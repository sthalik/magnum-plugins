# [configuration_]
[configuration]
# Encoder effort, 1 (fastest) to 11 (smallest file). 10 and 11 are slow, and 7,
# libjxl's default, is fine for most uses. Doesn't affect decoding speed.
# Output is lossless at every value.
effort=10
# Decoding speed tier, 0 (smallest file) to 4 (fastest decoding).
decodingSpeed=0
# Threads to encode with. Values above 1 start a JxlThreadParallelRunner
# with that many worker threads, 1 or less encodes in the calling thread.
threads=1
# [configuration_]
